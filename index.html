<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Minha Escala — Leonardo</title>
<style>
  :root {
    --bg: #0e0e0e;
    --bg2: #161616;
    --bg3: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.13);
    --text: #f0f0f0;
    --text2: #888;
    --text3: #4a4a4a;
    --purple: #BF48DB;
    --purple-bg: rgba(191,72,219,0.13);
    --purple-dim: rgba(191,72,219,0.07);
    --amber: #EF9F27;
    --amber-bg: rgba(239,159,39,0.13);
    --red: #E24B4A;
    --red-bg: rgba(226,75,74,0.13);
    --blue: #378ADD;
    --blue-bg: rgba(55,138,221,0.13);
    --green: #1D9E75;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; min-height: 100vh; }
  body { padding-bottom: 60px; }

  /* TOPBAR */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(14,14,14,0.94);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 0.5px solid var(--border);
    padding: 14px 20px 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .logo-box { width: 34px; height: 34px; background: var(--purple); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; }
  .logo-box span { color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  .brand { font-size: 15px; font-weight: 500; letter-spacing: 1px; }
  .brand-sub { font-size: 10px; color: var(--text2); letter-spacing: 2px; margin-top: 2px; }
  .topbar-right { text-align: right; }
  .today-badge { font-size: 11px; color: var(--text2); line-height: 1.6; }
  .working-today { font-size: 11px; font-weight: 600; color: var(--purple); margin-top: 2px; }
  .free-today { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* STATS */
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 14px 16px 0; }
  .stat { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .stat-n { font-size: 22px; font-weight: 600; color: var(--purple); }
  .stat-l { font-size: 10px; color: var(--text2); margin-top: 3px; text-transform: uppercase; letter-spacing: .5px; }

  /* FILTROS */
  .filters { display: flex; gap: 6px; padding: 14px 16px 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .filters::-webkit-scrollbar { display: none; }
  .fbtn { white-space: nowrap; font-size: 11px; padding: 5px 13px; border-radius: 20px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; -webkit-user-select: none; user-select: none; transition: all .15s; }
  .fbtn.active { background: var(--purple); color: #fff; border-color: var(--purple); }

  /* CONTEÚDO */
  .content { padding: 16px 16px 0; }

  /* MÊS */
  .month-block { margin-bottom: 8px; }
  .month-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; margin-top: 20px; }
  .month-header:first-child { margin-top: 0; }
  .month-title { font-size: 10px; font-weight: 600; color: var(--text2); letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; }
  .month-count { font-size: 10px; color: var(--text3); background: var(--bg3); padding: 2px 8px; border-radius: 10px; }
  .month-line { flex: 1; height: 0.5px; background: var(--border); }

  /* CARD DIA */
  .day-card {
    background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 13px 15px;
    margin-bottom: 6px; display: flex; align-items: center; gap: 14px;
  }
  .day-card.is-today { border-color: var(--purple); background: var(--purple-dim); }

  .day-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-fds     { background: var(--purple); }
  .dot-noturno { background: var(--blue); }
  .dot-sexta   { background: var(--amber); }
  .dot-feriado { background: var(--red); }

  .day-info { flex: 1; min-width: 0; }
  .day-date { font-size: 15px; font-weight: 500; color: var(--text); }
  .day-weekday { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .day-obs { font-size: 11px; color: var(--text3); margin-top: 3px; }

  .day-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
  .badge-fds     { background: var(--purple-bg); color: var(--purple); }
  .badge-noturno { background: var(--blue-bg); color: var(--blue); }
  .badge-sexta   { background: var(--amber-bg); color: var(--amber); }
  .badge-feriado { background: var(--red-bg); color: var(--red); }

  .today-tag { font-size: 10px; background: var(--purple); color: #fff; padding: 2px 7px; border-radius: 10px; margin-left: 6px; font-weight: 600; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 13px; }

  /* PRÓXIMO DIA */
  .next-wrap { padding: 14px 16px 0; }
  .next-card { background: var(--purple-bg); border: 0.5px solid var(--purple); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .next-label { font-size: 10px; color: var(--purple); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 4px; }
  .next-date { font-size: 16px; font-weight: 600; color: var(--text); }
  .next-day { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .next-count { margin-left: auto; text-align: right; font-size: 11px; color: var(--purple); font-weight: 600; }

  @media (min-width: 600px) {
    body { max-width: 640px; margin: 0 auto; }
    .topbar, .stats, .filters, .content, .next-wrap { padding-left: 24px; padding-right: 24px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo-box"><span>LN</span></div>
    <div><div class="brand">Minha Escala</div><div class="brand-sub">Leonardo · Eq 02 · D2</div></div>
  </div>
  <div class="topbar-right">
    <div class="today-badge" id="top-date"></div>
    <div id="top-status"></div>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n" id="s-total">0</div><div class="stat-l">Dias totais</div></div>
  <div class="stat"><div class="stat-n" id="s-fds">0</div><div class="stat-l">Fins de semana</div></div>
  <div class="stat"><div class="stat-n" id="s-noturno">0</div><div class="stat-l">Noturnos</div></div>
</div>

<div class="next-wrap" id="next-wrap"></div>

<div class="filters" id="filters">
  <button class="fbtn active" data-f="all">Todos</button>
  <button class="fbtn" data-f="fds">Fim de semana</button>
  <button class="fbtn" data-f="noturno">Noturno</button>
  <button class="fbtn" data-f="sexta">Sexta</button>
  <button class="fbtn" data-f="feriado">Feriado</button>
</div>

<div class="content" id="board"></div>

<script>
const DIAS = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
const MESES = ["","Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

const DIAS_LEO = [
  {d:"2026-04-27",tipo:"noturno",obs:""},
  {d:"2026-05-01",tipo:"sexta",obs:"01/05 — toda Equipe 02"},
  {d:"2026-05-02",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-05-03",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-05-07",tipo:"noturno",obs:""},
  {d:"2026-05-13",tipo:"noturno",obs:""},
  {d:"2026-05-19",tipo:"noturno",obs:""},
  {d:"2026-05-25",tipo:"noturno",obs:""},
  {d:"2026-05-29",tipo:"sexta",obs:"Toda Equipe 02"},
  {d:"2026-05-30",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-05-31",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-06-10",tipo:"noturno",obs:""},
  {d:"2026-06-16",tipo:"noturno",obs:""},
  {d:"2026-06-22",tipo:"noturno",obs:""},
  {d:"2026-06-26",tipo:"sexta",obs:"Toda Equipe 02"},
  {d:"2026-06-27",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-06-28",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-07-02",tipo:"noturno",obs:""},
  {d:"2026-07-08",tipo:"noturno",obs:""},
  {d:"2026-07-14",tipo:"noturno",obs:""},
  {d:"2026-07-20",tipo:"noturno",obs:""},
  {d:"2026-07-24",tipo:"sexta",obs:"Toda Equipe 02"},
  {d:"2026-07-25",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-07-26",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-07-30",tipo:"noturno",obs:""},
  {d:"2026-08-05",tipo:"noturno",obs:""},
  {d:"2026-08-11",tipo:"noturno",obs:""},
  {d:"2026-08-17",tipo:"noturno",obs:""},
  {d:"2026-08-21",tipo:"sexta",obs:"Toda Equipe 02"},
  {d:"2026-08-22",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-08-23",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-08-27",tipo:"noturno",obs:""},
  {d:"2026-09-02",tipo:"noturno",obs:""},
  {d:"2026-09-08",tipo:"noturno",obs:""},
  {d:"2026-09-14",tipo:"noturno",obs:""},
  {d:"2026-09-18",tipo:"sexta",obs:"Toda Equipe 02"},
  {d:"2026-09-19",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-09-20",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-09-24",tipo:"noturno",obs:""},
  {d:"2026-09-30",tipo:"noturno",obs:""},
  {d:"2026-10-06",tipo:"noturno",obs:""},
  {d:"2026-10-12",tipo:"feriado",obs:"Feriado — N. Sra. Aparecida"},
  {d:"2026-10-16",tipo:"sexta",obs:"Toda Equipe 02"},
  {d:"2026-10-17",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-10-18",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-10-22",tipo:"noturno",obs:""},
  {d:"2026-11-03",tipo:"noturno",obs:""},
  {d:"2026-11-09",tipo:"noturno",obs:""},
  {d:"2026-11-13",tipo:"sexta",obs:"Toda Equipe 02"},
  {d:"2026-11-14",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-11-15",tipo:"fds",obs:"15/11 cai no domingo"},
  {d:"2026-11-19",tipo:"noturno",obs:""},
  {d:"2026-11-25",tipo:"noturno",obs:""},
  {d:"2026-12-01",tipo:"noturno",obs:""},
  {d:"2026-12-07",tipo:"noturno",obs:""},
  {d:"2026-12-11",tipo:"sexta",obs:"Toda Equipe 02"},
  {d:"2026-12-12",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-12-13",tipo:"fds",obs:"Fim de semana Eq 02"},
  {d:"2026-12-17",tipo:"noturno",obs:""},
  {d:"2026-12-23",tipo:"noturno",obs:""},
];

const TIPO_LABEL = {
  fds: "Fim de semana",
  noturno: "Noturno D2",
  sexta: "Sexta — EQ02",
  feriado: "Feriado ⭐"
};

let filtro = "all";

function parseDate(str) {
  const [y,m,d] = str.split("-").map(Number);
  return new Date(y, m-1, d);
}

function formatDate(str) {
  const d = parseDate(str);
  return d.getDate().toString().padStart(2,"0") + "/" + (d.getMonth()+1).toString().padStart(2,"0");
}

function isTodayStr(str) {
  const now = new Date();
  const d = parseDate(str);
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}

function isPast(str) {
  const now = new Date(); now.setHours(0,0,0,0);
  return parseDate(str) < now;
}

function updateTopbar() {
  const now = new Date();
  document.getElementById("top-date").textContent = now.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
  const todayWork = DIAS_LEO.find(d => isTodayStr(d.d));
  const statusEl = document.getElementById("top-status");
  if (todayWork) {
    statusEl.innerHTML = `<div class="working-today">● Você trabalha hoje</div>`;
  } else {
    statusEl.innerHTML = `<div class="free-today">Folga hoje</div>`;
  }
}

function updateStats() {
  document.getElementById("s-total").textContent = DIAS_LEO.length;
  document.getElementById("s-fds").textContent = DIAS_LEO.filter(d => d.tipo==="fds").length;
  document.getElementById("s-noturno").textContent = DIAS_LEO.filter(d => d.tipo==="noturno").length;
}

function updateNextDay() {
  const now = new Date(); now.setHours(0,0,0,0);
  const next = DIAS_LEO.find(d => parseDate(d.d) >= now && !isTodayStr(d.d));
  const wrap = document.getElementById("next-wrap");
  if (!next) { wrap.innerHTML = ""; return; }
  const nd = parseDate(next.d);
  const diff = Math.round((nd - now) / 864e5);
  const diffTxt = diff === 1 ? "amanhã" : `em ${diff} dias`;
  wrap.innerHTML = `
    <div class="next-card">
      <div>
        <div class="next-label">Próximo dia de trabalho</div>
        <div class="next-date">${formatDate(next.d)} — ${DIAS[nd.getDay()]}</div>
        <div class="next-day">${TIPO_LABEL[next.tipo]}${next.obs ? " · " + next.obs : ""}</div>
      </div>
      <div class="next-count">${diffTxt}</div>
    </div>`;
}

function render() {
  const visible = filtro === "all" ? DIAS_LEO : DIAS_LEO.filter(d => d.tipo === filtro);

  // agrupar por mês
  const groups = {};
  visible.forEach(d => {
    const dt = parseDate(d.d);
    const key = dt.getFullYear() + "-" + (dt.getMonth()+1).toString().padStart(2,"0");
    const label = MESES[dt.getMonth()+1] + " " + dt.getFullYear();
    if (!groups[key]) groups[key] = {label, items:[]};
    groups[key].items.push(d);
  });

  let html = "";
  Object.keys(groups).sort().forEach(key => {
    const g = groups[key];
    html += `<div class="month-header">
      <span class="month-title">${g.label}</span>
      <span class="month-count">${g.items.length}</span>
      <div class="month-line"></div>
    </div>`;
    g.items.forEach(d => {
      const dt = parseDate(d.d);
      const isToday = isTodayStr(d.d);
      const past = isPast(d.d);
      html += `<div class="day-card${isToday?" is-today":""}" style="${past&&!isToday?"opacity:.4":""}">
        <div class="day-dot dot-${d.tipo}"></div>
        <div class="day-info">
          <div class="day-date">${formatDate(d.d)}${isToday?'<span class="today-tag">HOJE</span>':""}</div>
          <div class="day-weekday">${DIAS[dt.getDay()]}</div>
          ${d.obs?`<div class="day-obs">${d.obs}</div>`:""}
        </div>
        <span class="day-badge badge-${d.tipo}">${TIPO_LABEL[d.tipo]}</span>
      </div>`;
    });
  });

  document.getElementById("board").innerHTML = html || '<div class="empty">Nenhum dia nesse filtro.</div>';
}

document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest(".fbtn");
  if (!btn) return;
  filtro = btn.dataset.f;
  document.querySelectorAll(".fbtn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
});

updateTopbar();
updateStats();
updateNextDay();
render();
</script>
</body>
</html>
